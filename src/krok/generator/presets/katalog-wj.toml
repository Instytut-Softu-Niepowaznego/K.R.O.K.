# Katalog przedmiotów i kompetencji Wydziału Informatyki (WJ), z którego generator buduje programy studiów.
# Wartości orientacyjne, wzorowane na typowym programie. Można je poprawiać bez zmian w kodzie.
#
# competence.external = true -> prowadzący spoza wydziału: mniej dni dostępności (lecturers.external_days w presecie).
# subject.level: "inz" | "mgr" | "any";  semesters = [od, do] (semestr studiów danego stopnia)
# subject.forms: jednostki 45 min w tygodniu na formę (W/C/L/P);  fields: id kierunków albo ["*"]
# subject.lab_type: typ sali dla L i P (domyślnie lab-it)

