[project]
name = "krok"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jakub-rudnik", email = "jakub.rudnik@interia.pl" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.29.0",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.0",
]

[project.scripts]
krok = "krok:main"
krok-gen = "krok.generator.cli:main"
krok-db = "krok.db.cli:main"
krok-events = "krok.events.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
